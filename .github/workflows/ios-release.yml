name: iOS release

# Builds, signs and uploads to TestFlight on Apple's own macOS runner — Xcode included, nothing to install locally.
# Signing is Xcode-managed (android/app already uses CODE_SIGN_STYLE = Automatic): give Xcode an App Store Connect API
# key and it provisions and signs on its own, no .p12/.mobileprovision files to manage.
#
# One-time setup, once you have an Apple Developer Program membership:
#   1. App Store Connect → Users and Access → Integrations → App Store Connect API → generate a key with the
#      "App Manager" role. Note the Key ID and Issuer ID, download the .p8 file (Apple only lets you download it once).
#   2. just ios-ci-setup   (reads the downloaded AuthKey_<KEYID>.p8 itself, asks for the Issuer ID; stores the key,
#      its id, the Issuer ID and the Team ID as secrets and sets IOS_SIGNING_READY, so step 4 is done too)
#   3. In App Store Connect, create the app once by hand (bundle id ch.zettelispiil.app) — the very first app record
#      can't be created by CI, only builds after that.
#   4. Set the repository variable IOS_SIGNING_READY = true (Settings → Secrets and variables → Actions → Variables),
#      so this workflow's TestFlight upload step stops skipping itself.
# Until then, this workflow still runs and builds (proving the native project itself is sound), it just skips signing
# and upload — safe to merge and run early.
on:
  workflow_dispatch:

jobs:
  build:
    # Capacitor 8 needs Xcode 26; its native deps come via Swift Package Manager (ios/App/CapApp-SPM), no CocoaPods
    runs-on: macos-26
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_PATH: ${{ github.workspace }}/.appstoreconnect-key.p8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - run: npm ci
      - run: npx cap sync ios

      - name: Install the App Store Connect API key
        if: ${{ vars.IOS_SIGNING_READY == 'true' }}
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: printf '%s' "$PRIVATE_KEY" > "$KEY_PATH"

      - name: Archive (unsigned; the export signs it)
        if: ${{ vars.IOS_SIGNING_READY == 'true' }}
        working-directory: ios/App
        run: |
          # unsigned here: signing the archive wants a development profile, and those need a registered test device
          # ("Your team has no devices"). The export below signs it for the App Store (cloud-managed, via the API key)
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$(node -p "require('../../package.json').version")" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      # the version players see is package.json's; every upload needs a new build number: this workflow's run number
      - name: Export and upload to TestFlight
        if: ${{ vars.IOS_SIGNING_READY == 'true' }}
        working-directory: ios/App
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Build only, unsigned (no API key secret yet — proves the native project builds)
        if: ${{ vars.IOS_SIGNING_READY != 'true' }}
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO build
