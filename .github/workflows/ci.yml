name: CI

# Work happens on dev and reaches main by pull request (GitHub Copilot reviews it; main is protected: PRs only, green
# check + e2e). Every push to dev and every PR: lint, typecheck, unit tests, e2e (the same `just check` / `just e2e` a
# laptop runs). PRs also get a Vercel preview; Vercel's own deploy of main is off (vercel.json). A merge into main runs them again, and if package.json carries a version with no tag yet
# (`just release` bumps it on dev), that merge is the release: Vercel deploy, then tag + GitHub release, iOS build. A merge
# without a version bump only runs the checks. All in one run: a tag pushed by a workflow can't start another workflow.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # a newer push replaces the run; never cut a release short

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: extractions/setup-just@v4
      - run: npm ci
      - name: Install Redis for store regression tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: just check

  e2e:
    needs: check
    # ponytail: pinned, Playwright's --with-deps tends to lag a new Ubuntu (ubuntu-latest moves to 26 in Oct 2026); bump once it supports it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: extractions/setup-just@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: just e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  # a merge into main whose package.json version has no tag yet is a release (`just release` bumped it)
  release:
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  # deploy first, tag after: a failed deploy leaves no tag behind, so re-running this job deploys it (tagging first
  # meant a re-run saw "already released" and never deployed)
  deploy:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # the tag and the GitHub release
      pull-requests: read # the notes come from the merged release pull request
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Tag and publish the GitHub release
        # the release pull request's description (what `just release` wrote) on top, then GitHub's list of merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          notes=$(gh pr list --state merged --base main --search "$GITHUB_SHA" --json body -q '.[0].body // ""')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes "$notes" --generate-notes

  ios:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # ios-release.yml builds (and, once IOS_SIGNING_READY is set, signs and uploads to TestFlight) on its own macOS
      # runner; this just fires it after a successful deploy. Add the same step for android-release.yml once its
      # Play Store side is ready (just android-keystore-setup, then just secret-gh PLAY_SERVICE_ACCOUNT_JSON).
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run ios-release.yml --repo "$GITHUB_REPOSITORY" --ref main
