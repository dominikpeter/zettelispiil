name: CI

# Work happens on dev and reaches main by pull request. Every PR: lint, typecheck, unit tests, e2e (the same `just check`
# / `just e2e` a laptop runs). A merge into main runs them again, and if package.json carries a version with no tag yet
# (`just release` bumps it on dev), that merge is the release: tag + GitHub release, Vercel deploy, iOS build. A merge
# without a version bump only runs the checks. All in one run: a tag pushed by a workflow can't start another workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a newer push replaces a PR run; never cut a release short

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: extractions/setup-just@v4
      - run: npm ci
      - run: just check

  e2e:
    needs: check
    # ponytail: pinned, Playwright's --with-deps tends to lag a new Ubuntu (ubuntu-latest moves to 26 in Oct 2026); bump once it supports it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: extractions/setup-just@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: just e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  # a merge into main whose package.json version isn't tagged yet: tag it and write the GitHub release (notes from the
  # merged PRs). Only then deploy: a release is the one thing that reaches production (and, with IOS_SIGNING_READY, TestFlight)
  release:
    needs: e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: tag
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="v$(node -p 'require("./package.json").version')"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "$v is out already: checks only, no release"; exit 0; fi
          # the notes are the merged release PR's description (what `just release` wrote), then GitHub's list of merged PRs
          notes=$(gh pr list --state merged --search "$GITHUB_SHA" --json body -q '.[0].body // ""')
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes "$notes" --generate-notes
          echo "tag=$v" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  ios:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # ios-release.yml builds (and, once IOS_SIGNING_READY is set, signs and uploads to TestFlight) on its own macOS
      # runner; this just fires it after a successful deploy. Add the same step for android-release.yml once its
      # Play Store side is ready (just android-keystore-setup, then just secret-gh PLAY_SERVICE_ACCOUNT_JSON).
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run ios-release.yml --repo "$GITHUB_REPOSITORY" --ref main
