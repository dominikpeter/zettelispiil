# prek (https://github.com/j178/prek) runs these on every commit. Install once: `just setup`.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1500] # store screenshots are ~1 MB; anything bigger is likely a mistake (a video, a build)
      - id: check-json
        exclude: ^tsconfig\.json$ # comments allowed there
      - id: check-yaml
  - repo: local
    hooks:
      - id: no-secrets
        name: no API keys
        entry: bash -c '! git diff --cached -U0 | grep -E "^\+.*(sk-(proj-)?[A-Za-z0-9_-]{20,}|(sk|rk)_(live|test)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|re_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,})"'
        language: system
        pass_filenames: false
      - id: lint
        name: eslint
        entry: npx eslint
        language: system
        files: \.(ts|tsx|mjs)$
      - id: typecheck
        name: tsc
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
      - id: unit
        name: unit tests
        entry: npm test
        language: system
        pass_filenames: false
        files: ^src/
      - id: swiss-spelling
        name: Swiss spelling (no ß)
        entry: bash -c 'if grep -n "ß" "$@"; then echo "Swiss German writes ss, never ß"; exit 1; fi' --
        language: system
        files: ^(src/lib/i18n\.ts|docs/MANUAL\.md)$
      - id: conventional-commit
        name: "commit message: type(scope): summary"
        entry: bash scripts/commit-msg.sh
        language: system
        stages: [commit-msg]
      - id: version
        name: version matches the release
        entry: bash scripts/check-version.sh
        language: system
        pass_filenames: false
        files: ^package\.json$
